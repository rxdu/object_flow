# The core's dependencies against the RustSec advisory database, on every
# push and every week, since an advisory published against a dependency
# nobody changed is found only by asking again (ADR-0183 decision 2, the
# second production review's RELEASE-2); and by hand.
name: advisories

on:
  push:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # pinned by commit, as every action is: a tag can be moved under a
      # workflow, a commit cannot (fifth production review, ADR-0191)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # no credential left in the checkout for a later step to read
          persist-credentials: false
      - name: The core's dependencies against the RustSec advisory database
        working-directory: core
        run: |
          cargo install cargo-audit --locked
          cargo audit
