# Every gate on every push and pull request (ADR-0183 decision 2): the one
# command a change is checked by locally, scripts/check-all, so CI and a
# local run cannot drift. The advisories are advisories.yml.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-all:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # PostgreSQL 16, the floor ADR-0213 sets, its text compared by bytes as
    # the store needs; pinned by digest, as an action is by commit
    services:
      postgres:
        image: postgres@sha256:301bcb60b8a3ee4ab7e147932723e3abd1cef53516ce5210b39fd9fe5e3602ae # 16.8
        env:
          POSTGRES_USER: objectflow
          POSTGRES_PASSWORD: objectflow
          POSTGRES_DB: objectflow
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U objectflow" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # a compiler warning fails CI, as clippy's do everywhere; set for the
      # whole job, so every build in it shares one cache
      RUSTFLAGS: -D warnings
      # the core's tests run again on the service above (ADR-0213)
      OBJECTFLOW_CHECK_POSTGRES: host=localhost port=5432 user=objectflow password=objectflow dbname=objectflow
    steps:
      # pinned by commit, as every action is: a tag can be moved under a
      # workflow, a commit cannot (fifth production review, ADR-0191)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # no credential left in the checkout for a later step to read
          persist-credentials: false
      - name: The pinned Rust toolchain
        # the version core/rust-toolchain.toml pins, read from it
        working-directory: core
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/Cargo.lock', 'core/rust-toolchain.toml') }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: The scripts' Python environment
        run: scripts/setup/python-env
      - name: The Flow Studio server's environment
        working-directory: apps/flow-studio/server
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: The Flow Studio web app's packages
        working-directory: apps/flow-studio/web
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      # the full-volume test mounts a tmpfs in a user and mount namespace of
      # its own, which Ubuntu 24.04's AppArmor refuses an unprivileged process
      # unless this is lifted; the test fails in CI rather than skip
      # (`a_full_volume_loses_no_acknowledged_write`, the audit's durability S1)
      - name: Unprivileged user namespaces, for the full-volume test
        run: |
          # where AppArmor holds the restriction, from Ubuntu 23.10; 22.04 has none
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Every gate
        run: scripts/check-all
