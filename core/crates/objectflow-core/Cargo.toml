[package]
name = "objectflow-core"
description = "ObjectFlow's engine: flows, their rules, and a store that records everything they produce"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
saphyr-parser.workspace = true
rusqlite.workspace = true
tokio-postgres.workspace = true
bytes.workspace = true
tokio-postgres-rustls.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
# the client's own runtime run beside a caller's, block_in_place (ADR-0213)
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
regex.workspace = true

[features]
# the seams the adversarial harness re-decides a request through: a copy of
# a store, and a copy keeping only some objects (adversarial-harness.md §1);
# no route of the service reaches them
harness = []
# the faults a test makes happen at a chosen point of a batch, a request or
# its commit, a store error, a panic, or a hold a kill lands in (ADR-0228
# decision 13), and at a publish's install, a store error (ADR-0229 decision
# 10); no release build has them
faults = []

[lints]
workspace = true
