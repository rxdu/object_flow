module: catalog
categories: [live, closed]
types:
  Genre:
    description: A genre.
    tracking: record
    attributes:
      name: { type: string }
    states:
      LISTED: { description: Listed., category: live }
      DROPPED: { description: Dropped., category: closed, final: true }
    transitions:
      add: { kind: initial, to: LISTED, required_inputs: [name] }
      drop: { kind: external, from: LISTED, to: DROPPED }
