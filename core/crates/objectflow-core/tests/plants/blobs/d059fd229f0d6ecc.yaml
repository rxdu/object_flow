module: spans
categories: [live, closed]
enumerations:
  Sort: [A, B]
types:
  Period:
    description: A span of time.
    tracking: record
    attributes:
      label: { type: string }
      kind: { type: Sort, optional: true }
    states:
      OPEN: { description: Open., category: live }
      CLOSED: { description: Ended., category: closed, final: true }
    transitions:
      open: { kind: initial, to: OPEN, required_inputs: [label], optional_inputs: [kind] }
      close: { kind: external, from: OPEN, to: CLOSED }
migration:
  description: A span is a period.
  moved_types:
    Span: [ { to: Period, attributes: { kind: sort } } ]
