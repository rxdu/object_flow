module: dues
categories: [live, closed]
types:
  Due:
    description: A thing due on a day.
    tracking: record
    attributes:
      title: { type: string }
      due: { type: date }
      count: { type: int }
    states:
      OPEN: { description: Open., category: live }
      DONE: { description: Done., category: closed, final: true }
    conditions:
      said: { description: It is due., expression: 'date(due) == due', remedy: self_serviceable }
    transitions:
      open: { kind: initial, to: OPEN, required_inputs: [title, due, count] }
      close: { kind: external, from: OPEN, to: DONE, guards: { said: deny } }
