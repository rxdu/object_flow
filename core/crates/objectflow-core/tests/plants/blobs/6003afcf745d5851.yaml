module: catalog
categories: [live, closed]
enumerations:
  Binding: [HARDCOVER]
types:
  Book:
    description: A book.
    tracking: record
    attributes:
      title: { type: string }
      format: { type: Binding }
      formats: { type: "Binding[]" }
    states:
      ON_SHELF: { description: On the shelf., category: live }
      GONE: { description: Given away., category: closed, final: true }
    transitions:
      add: { kind: initial, to: ON_SHELF, required_inputs: [title, format] }
      give: { kind: external, from: ON_SHELF, to: GONE }
migration:
  description: A format is a binding.
  renamed_enumerations:
    Format: Binding
