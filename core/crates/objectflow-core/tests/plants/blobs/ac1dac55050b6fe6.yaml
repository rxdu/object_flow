module: notes
categories: [live, closed]
types:
  Note:
    description: A note.
    tracking: record
    attributes:
      title: { type: string }
    states:
      OPEN: { description: Open., category: live }
      DONE: { description: Done., category: closed, final: true }
    conditions:
      titled: { description: Titled., expression: 'title != "see inputs.note"', remedy: unreachable_from_here }
    transitions:
      open: { kind: initial, to: OPEN, required_inputs: [title] }
      close: { kind: external, from: OPEN, to: DONE, guards: { titled: deny } }
