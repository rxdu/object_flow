examples_for: probe
setups:
  a_thing:
    description: A thing and its mover.
    steps:
      - request: { type: Thing, transition: add, as: thing, inputs: { label: Crate } }
      - request: { type: Mover, transition: add, as: mover, inputs: { thing: thing } }
examples:
  a_move_records_custody:
    description: Moving the thing records who holds it.
    given: a_thing
    request: { object: mover, transition: move, inputs: { to_whom: Ana } }
    expect: { verdict: applied, state: ON, cascaded: [Custody.record] }
  the_receiver_is_required:
    description: Who takes it is required, as the record requires it.
    given: a_thing
    request: { object: mover, transition: move, inputs: { reason: Reason.SALE } }
    expect: { verdict: applied, state: ON }
