module: desk
categories: [live, closed]
types:
  Member:
    description: A member.
    tracking: record
    attributes:
      login: { type: identity, actor_kind: human, unique: true, indexed: true }
      code: { type: string, optional: true, unique: true }
      asserted: { type: string, optional: true }
      code_key: { type: string, optional: true }
      login_fold: { type: string, optional: true }
    observations:
      notes:
        kind: Note
        description: A note.
        attributes:
          text: { type: string }
          asserted: { type: string, optional: true }
    states:
      ON: { description: On., category: live }
      OFF: { description: Off., category: closed, final: true }
    transitions:
      join: { kind: initial, to: ON, required_inputs: [login] }
      leave: { kind: external, from: [ON], to: OFF }
