module: members
categories: [live, closed]
types:
  Account:
    description: A person who signs in.
    tracking: record
    attributes:
      login: { type: identity, actor_kind: human, unique: true }
    states:
      ACTIVE: { description: Signs in., category: live }
      ARCHIVED: { description: Gone., category: closed, final: true }
    transitions:
      join: { kind: initial, to: ACTIVE, required_inputs: [login] }
      archive: { kind: external, from: ACTIVE, to: ARCHIVED }
migration:
  description: Members are accounts.
  moved_types:
    Member: [ { to: Account } ]
