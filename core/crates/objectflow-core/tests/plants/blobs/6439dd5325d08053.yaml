module: labels
categories: [live, closed]
enumerations:
  Cover: [PRINT]
types:
  Sticker:
    description: A sticker.
    tracking: record
    attributes:
      kind: { type: Cover }
    states:
      ON: { description: On., category: live }
      OFF: { description: Off., category: closed, final: true }
    transitions:
      add: { kind: initial, to: ON, required_inputs: [kind] }
      remove: { kind: external, from: ON, to: OFF }
migration:
  description: A format is a cover.
  renamed_enumerations:
    Format: Cover
