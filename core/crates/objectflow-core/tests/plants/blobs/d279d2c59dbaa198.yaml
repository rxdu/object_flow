module: lines
categories: [live, closed]
types:
  Line:
    description: A line.
    tracking: record
    attributes:
      quantity: { type: "decimal(9,2)" }
      delivered: { type: int, optional: true }
    states:
      OPEN: { description: Open., category: live }
      DONE: { description: Done., category: closed, final: true }
    conditions:
      word: { description: The count is fine., expression: 'inputs.snap is null or inputs.snap.size > 10', remedy: self_serviceable }
    transitions:
      open: { kind: initial, to: OPEN, required_inputs: [quantity] }
      deliver:
        kind: external
        from: [OPEN]
        to: DONE
        description: Delivers it.
        inputs:
          count: { type: int }
          snap: { type: file, optional: true }
        guards: { word: deny }
      recount:
        kind: internal
        from: [OPEN]
        description: Counts it again.
        inputs:
          count: { type: "decimal(9,2)" }
