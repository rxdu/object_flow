module: nums
categories: [live, closed]
types:
  Num:
    description: A number.
    tracking: record
    attributes:
      n: { type: int }
    states:
      OPEN: { description: Open., category: live }
      DONE: { description: Done., category: closed, final: true }
    conditions:
      positive: { description: n is positive., expression: n > 0, remedy: self_serviceable }
      negative_input: { description: n given is negative., expression: inputs.n < 0, remedy: self_serviceable }
    transitions:
      make: { kind: initial, to: OPEN, required_inputs: [n] }
      renumber: { kind: internal, from: OPEN, required_inputs: [n], guards: { positive: deny, negative_input: deny } }
      finish: { kind: external, from: OPEN, to: DONE }
