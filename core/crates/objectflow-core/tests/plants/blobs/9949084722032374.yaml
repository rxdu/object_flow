module: things
categories: [live, closed]
types:
  Thing:
    description: One thing.
    tracking: record
    observations:
      notes:
        kind: Other
        description: A note.
        attributes:
          text: { type: string }
    states:
      OPEN: { description: Open., category: live }
      DONE: { description: Done., category: closed, final: true }
    transitions:
      add: { kind: initial, to: OPEN }
      finish: { kind: external, from: [OPEN], to: DONE }
  Other:
    description: One thing.
    tracking: record
    states:
      OPEN: { description: Open., category: live }
      DONE: { description: Done., category: closed, final: true }
    transitions:
      add: { kind: initial, to: OPEN }
      finish: { kind: external, from: [OPEN], to: DONE }
