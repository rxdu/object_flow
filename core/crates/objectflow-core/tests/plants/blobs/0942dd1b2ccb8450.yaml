module: cb
imports:
  ca: [TA]
categories: [live]
types:
  TB:
    description: A thing.
    tracking: record
    attributes:
      r: { reference: TA, optional: true }
    states:
      S: { category: live, description: Open. }
      E: { category: live, final: true, description: Done. }
    derived_attributes:
      b0: { description: The first., expression: r.a12 + r.a12 }
      b1: { description: One., expression: this.b0 + this.b0 }
      b2: { description: One., expression: this.b1 + this.b1 }
      b3: { description: One., expression: this.b2 + this.b2 }
      b4: { description: One., expression: this.b3 + this.b3 }
      b5: { description: One., expression: this.b4 + this.b4 }
      b6: { description: One., expression: this.b5 + this.b5 }
      b7: { description: One., expression: this.b6 + this.b6 }
      b8: { description: One., expression: this.b7 + this.b7 }
      b9: { description: One., expression: this.b8 + this.b8 }
      b10: { description: One., expression: this.b9 + this.b9 }
      b11: { description: One., expression: this.b10 + this.b10 }
      b12: { description: One., expression: this.b11 + this.b11 }
    invariants:
      big: { description: Big., expression: b12 > 0 }
    transitions: { t: { kind: initial, to: S }, e: { kind: external, from: S, to: E } }
