module: hub
categories: [live, closed]
types:
  Slot:
    description: A slot work is planned in.
    tracking: record
    attributes:
      label: { type: string, description: Its label. }
    states:
      OPEN: { description: Open., category: live }
      CANCELLED: { description: Cancelled., category: closed, final: true }
    transitions:
      open: { kind: initial, to: OPEN, required_inputs: [label], description: Opens it. }
      move: { kind: internal, from: [OPEN], required_inputs: [label], description: Moves it. }
      cancel:
        kind: external
        from: [OPEN]
        to: CANCELLED
        description: Cancels it.
        inputs:
          why: { type: string, optional: true, description: Why it is cancelled. }
  Bay:
    description: A bay a slot is in.
    tracking: record
    attributes:
      slot: { reference: Slot, description: Its slot. }
    states:
      OPEN: { description: Open., category: live }
      SHUT: { description: Shut., category: closed, final: true }
    transitions:
      open: { kind: initial, to: OPEN, required_inputs: [slot], description: Opens it. }
      close:
        kind: external
        from: [OPEN]
        to: SHUT
        description: Closes it.
        effect:
          - call: { target: slot, transition: cancel }
