module: mini
categories: [live, closed]
enumerations:
  Reason: [ASKED]
types:
  Job:
    description: A job.
    tracking: record
    attributes:
      title: { type: string }
      note:  { type: string, optional: true }
    states:
      OPEN: { category: live }
      DONE: { category: closed, final: true }
    derived_attributes:
      named: { description: Derived., expression: "title is not null" }
    invariants:
      entered: { description: An invariant., expression: "entered_at(OPEN) >= created_at" }
      has_name: { description: An invariant., expression: "named" }
    conditions:
      titled: { description: The job has a title., expression: title is not null, remedy: dependent }
    transitions:
      open:   { kind: initial, to: OPEN, required_inputs: [title], optional_inputs: [note] }
      finish: { kind: external, from: [OPEN], to: DONE, guards: { titled: deny } }
