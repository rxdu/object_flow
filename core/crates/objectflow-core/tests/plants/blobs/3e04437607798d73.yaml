module: fleet
categories: [live, closed]
types:
  Asset:
    description: An asset.
    abstract: true
    tracking: record
    attributes:
      pieces: { reference: "Piece[]", opposite: asset, aggregation: composite }
  Robot:
    description: A robot.
    extends: Asset
    tracking: record
    inherited_parts:
      pieces: { cascade: [ { on: [retire], transition: drop, limit: 10 } ] }
    states:
      UP:   { category: live }
      GONE: { category: closed, final: true }
    transitions:
      make:   { kind: initial, to: UP }
      fit:    { kind: internal, from: [UP], effect: [ { create: { type: Piece, transition: fit, inputs: { asset: this, spare: this } } } ] }
      retire: { kind: external, from: [UP], to: GONE }
  Piece:
    description: A piece of an asset.
    tracking: record
    attributes:
      asset: { reference: Asset, opposite: pieces }
      spare: { reference: Robot }
    states:
      IN:  { category: live }
      OUT: { category: closed, final: true }
    transitions:
      fit:  { kind: initial, to: IN, required_inputs: [asset, spare], only_via: [Robot.fit] }
      drop: { kind: external, from: [IN], to: OUT, effect: [ { call: { target: spare, transition: retire } } ] }
