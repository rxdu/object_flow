module: shelf
imports: { catalog: [Genre] }
categories: [live, closed]
types:
  Book:
    description: A book.
    tracking: record
    attributes:
      title: { type: string }
      genre: { reference: Genre }
    states:
      ON_SHELF: { description: On the shelf., category: live }
      GONE: { description: Given away., category: closed, final: true }
    transitions:
      add: { kind: initial, to: ON_SHELF, required_inputs: [title, genre] }
      give: { kind: external, from: ON_SHELF, to: GONE }
