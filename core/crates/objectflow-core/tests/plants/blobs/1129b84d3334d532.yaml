module: mini
categories: [live, closed]
enumerations:
  Reason: [ASKED]
types:
  Job:
    description: A job.
    tracking: record
    attributes:
      title: { type: string }
      note:  { type: string, optional: true }
    states:
      OPEN: { category: live }
      DONE: { category: closed, final: true }
    derived_attributes:
      waited: { description: Derived., expression: "sum(i in this.intervals where i.state == OPEN: i.duration)" }
    invariants:
      short: { description: An invariant., expression: "waited < 30 days" }
    conditions:
      titled: { description: The job has a title., expression: title is not null, remedy: dependent }
    transitions:
      open:   { kind: initial, to: OPEN, required_inputs: [title], optional_inputs: [note] }
      finish: { kind: external, from: [OPEN], to: DONE, guards: { titled: deny } }
