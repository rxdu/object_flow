module: tasks
categories: [live]
types:
  Task:
    description: A task.
    tracking: record
    states: { S: { category: live, description: Open. }, E: { category: live, final: true, description: Done. } }
    transitions:
      t: { kind: initial, to: S }
      e: { kind: external, from: S, to: E, taken_by: [human] }
