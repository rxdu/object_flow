module: catalog
categories: [live, closed]
enumerations:
  Format: [HARDCOVER, PAPERBACK]
  Size: [SMALL, LARGE]
types:
  Book:
    description: A book.
    tracking: record
    attributes:
      title: { type: string }
      format: { type: Format }
      formats: { type: "Format[]" }
    states:
      ON_SHELF: { description: On the shelf., category: live }
      GONE: { description: Given away., category: closed, final: true }
    transitions:
      add: { kind: initial, to: ON_SHELF, required_inputs: [title, format] }
      give: { kind: external, from: ON_SHELF, to: GONE }
