module: cards
categories: [live, closed]
types:
  Card:
    description: A card.
    tracking: record
    attributes:
      title: { type: string }
      code: { type: string, indexed: true }
      reason: { type: string, optional: true }
      count: { type: int, optional: true }
      due: { type: date, optional: true, indexed: true }
      opened: { type: timestamp, optional: true }
    observations:
      notes:
        kind: CardNote
        description: A note on the card.
        attributes:
          text: { type: string }
        invariants:
          tagged: { description: A note is tagged., expression: 'starts_with(text, "#")' }
    states:
      OPEN: { description: Open., category: live }
      DONE: { description: Done., category: closed, final: true }
    conditions:
      said: { description: A reason is said., expression: 'count > 0', remedy: self_serviceable }
    transitions:
      add: { kind: initial, to: OPEN, required_inputs: [title, code] }
      close: { kind: external, from: OPEN, to: DONE, optional_inputs: [reason, count], guards: { said: deny } }
