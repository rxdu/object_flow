module: m
categories: [live]
sequences:
  s:
    description: A series.
types:
  T:
    description: A thing.
    tracking: record
    attributes:
      code: { type: string, identifier: { sequence: s, format: "T-{n:1000000}" } }
    states:
      S: { category: live, description: Open. }
      E: { category: live, final: true, description: Done. }
    transitions: { t: { kind: initial, to: S }, e: { kind: external, from: S, to: E } }
