module: m
categories: [live]
types:
  T:
    description: A counter.
    tracking: record
    attributes:
      count: { type: int, optional: true }
      other: { type: int, optional: true }
      nums: { type: "int[]" }
      total: { type: int, default: 0 }
    states: { S: { category: live, description: Open. }, E: { category: live, final: true, description: Done. } }
    transitions:
      t: { kind: initial, to: S, optional_inputs: [count, other] }
      bump: { kind: internal, from: S, inputs: { by: { type: int, optional: true } }, effect: [ { foreach: { item: n, array: nums, limit: 10, steps: [ { assign: { location: other, expr: 'n + count' } } ] } } ] }
      e: { kind: external, from: S, to: E }
