examples_for: archive
setups:
  a_folder:
    description: A folder holding a PNG scan.
    steps:
      - request: { type: Folder, transition: open, as: folder, inputs: { scan: { hash: "sha256:abababababababababababababababababababababababababababababababab", size: 48213, media_type: image/png } } }
examples:
  the_request:
    description: The request, given its file.
    given: a_folder
    request: { object: folder, transition: attach, inputs: { upload: { hash: "sha256:abababababababababababababababababababababababababababababababab", size: 200000, media_type: application/pdf } } }
    expect: { verdict: unsatisfied, clause: small, remedy: self_serviceable }
