module: hub
categories: [live, closed]
types:
  Slot:
    description: A slot work is planned in.
    tracking: record
    attributes:
      label: { type: string, description: Its label. }
      holds: { reference: 'Hold[]', opposite: slot, description: Its holds. }
    states:
      OPEN: { description: Open., category: live }
      CANCELLED: { description: Cancelled., category: closed, final: true }
    transitions:
      open: { kind: initial, to: OPEN, required_inputs: [label], description: Opens it. }
      move: { kind: internal, from: [OPEN], required_inputs: [label], description: Moves it. }
      cancel:
        kind: external
        from: [OPEN]
        to: CANCELLED
        description: Cancels it.
        inputs:
          why: { type: string, optional: true, description: Why it is cancelled. }
  Hold:
    description: A hold on a slot.
    tracking: record
    attributes:
      slot:
        reference: Slot
        opposite: holds
        description: The slot held.
        follows:
          - { on: [cancel], transition: release, inputs: { note: inputs.why }, limit: 5 }
          - { on: [move], transition: shift, inputs: { label: slot.label }, limit: 5 }
      label: { type: string, optional: true, description: Where it is. }
      note: { type: string, optional: true, description: Why it ended. }
    states:
      HELD: { description: Held., category: live }
      RELEASED: { description: Released., category: closed, final: true }
    transitions:
      take: { kind: initial, to: HELD, required_inputs: [slot], description: Takes it. }
      shift: { kind: internal, from: [HELD], required_inputs: [label], description: Shifts it. }
      release: { kind: external, from: [HELD], to: RELEASED, optional_inputs: [note], description: Releases it. }
