[package]
name = "objectflow-service"
description = "ObjectFlow's HTTP service: the engine's operations, one POST each, over a sandbox or a deployment's store (ADR-0150, ADR-0174)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
# the core's faults, which a test makes happen at a point of a batch through
# OBJECTFLOW_FAULT (ADR-0228 decision 13); no release build has them
faults = ["objectflow-core/faults"]

[dependencies]
objectflow-core.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
ureq.workspace = true
libc.workspace = true

[dev-dependencies]
rusqlite.workspace = true

[lints]
workspace = true
