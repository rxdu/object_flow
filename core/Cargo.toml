# ObjectFlow's core (ADR-0132, ADR-0153): the engine, synchronous, and the
# HTTP service that is its one asynchronous layer.
[workspace]
resolver = "3"
members = ["crates/objectflow-core", "crates/objectflow-service", "crates/objectflow-harness"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99.0"
license-file = "../LICENSE"
publish = false

[workspace.dependencies]
objectflow-core = { path = "crates/objectflow-core" }
saphyr-parser = "0.1.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# a deployment's store on PostgreSQL, synchronous as the core is (ADR-0213
# decision 3)
postgres = "0.19.14"
# the buffer a value is written into for PostgreSQL, already resolved through
# postgres
bytes = "1.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
# the schema's patterns, in the core's checker (ADR-0156 decision 2)
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
# serving connections through hyper's HTTP/1 builder with a timer, which
# axum::serve does not set: both already resolved through axum, with these
# features (ADR-0184 decision 4)
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "service"] }
# a deployment's evaluators asked over HTTP, with rustls and the platform's
# trust store (ADR-0175 decision 1)
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
# malloc_trim, which gives back what glibc keeps of the memory a publish or
# a long read freed: already resolved through tokio (ADR-0187 decision 2)
libc = "0.2.190"

[workspace.lints.rust]
# denied everywhere; the service allows it at its one call into glibc, which
# says why it is safe (ADR-0187 decision 2)
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
