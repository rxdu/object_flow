# ObjectFlow's core (ADR-0132, ADR-0153): the engine, synchronous, and the
# HTTP service that is its one asynchronous layer.
[workspace]
resolver = "3"
members = ["crates/objectflow-core", "crates/objectflow-service"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license-file = "../LICENSE"
publish = false

[workspace.dependencies]
objectflow-core = { path = "crates/objectflow-core" }
saphyr-parser = "0.1.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
