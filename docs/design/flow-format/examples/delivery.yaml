# yaml-language-server: $schema=../flow.schema.json
# Delivery flow: handing one reserved inventory item over to its customer.
module: delivery
imports: { inventory: [InventoryItem] }
categories: [live, closed]

types:
  Delivery:
    description: The delivery of one reserved inventory item to the customer it is reserved for.
    tracking: record

    attributes:
      unit:         { reference: InventoryItem }
      price:        { type: money(SGD) }
      delivered_at: { type: timestamp, optional: true }

    states:
      PREPARING:
        description: Being prepared; its checklist is worked through.
        category: live
      DELIVERED:
        description: Handed over; the item is delivered externally.
        category: closed
        final: true
        required_attributes: [delivered_at]

    conditions:
      unit_reserved:
        description: The item to deliver is reserved.
        expression: inputs.unit.state == InventoryItem.RESERVED
        remedy: dependent

    transitions:
      open:
        kind: initial
        to: PREPARING
        description: Opens a delivery of a reserved item, with one checklist item for each label given.
        required_inputs: [unit, price]
        inputs:
          checklist: { type: "string[]", description: The labels of the checklist items to create. }
        guards:
          unit_reserved: deny
        effect:
          - foreach:
              item: label
              array: inputs.checklist
              limit: 50
              steps:
                - create: { type: ChecklistItem, transition: add, inputs: { delivery: this, label: label } }
      complete:
        kind: external
        from: PREPARING
        to: DELIVERED
        description: Hands the item over, which delivers it externally at the delivery's price.
        effect:
          - assign: { location: delivered_at, expr: now }
          - call: { target: unit, transition: deliver_externally, inputs: { sale_price: price } }

  ChecklistItem:
    description: One thing a delivery checks before the item is handed over.
    tracking: record

    attributes:
      delivery: { reference: Delivery }
      label:    { type: string }

    states:
      OPEN:    { category: live }
      CHECKED: { category: closed, final: true }

    transitions:
      add:
        kind: initial
        to: OPEN
        description: Adds an item to a delivery's checklist.
        required_inputs: [delivery, label]
      check:
        kind: external
        from: OPEN
        to: CHECKED
        description: Marks the item as checked.
