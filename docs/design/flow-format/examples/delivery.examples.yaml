# yaml-language-server: $schema=../examples.schema.json
# What the delivery flow's rules do, as examples the engine runs at every publish (flow-format.md §11, ADR-0136).
examples_for: delivery

setups:
  a_reserved_item:
    description: A robot in stock, reserved for Acme for a week.
    steps:
      - request:
          type: InventoryItem
          transition: add
          as: robot
          inputs: { serial: WR-0001, model: Scout, list_price: SGD 12000.00, condition: Condition.NEW }
      - request: { object: robot, transition: reserve, inputs: { recipient: Acme, reserved_until: now + 7 days } }
  a_delivery_being_prepared:
    description: A delivery of the reserved robot, opened with a two-item checklist.
    given: a_reserved_item
    steps:
      - request:
          type: Delivery
          transition: open
          as: delivery
          creates: [battery, manual]
          inputs: { unit: robot, price: SGD 11500.00, checklist: [Battery charged, Manual included] }
  a_delivery_ready_to_sign_off:
    description: The delivery with both checklist items ticked and a courier assigned.
    given: a_delivery_being_prepared
    steps:
      - request: { object: battery, transition: check }
      - request: { object: manual, transition: check }
      - request: { type: Courier, transition: register, as: courier, inputs: { name: Swift Couriers } }
      - request: { object: delivery, transition: assign_courier, inputs: { courier: courier } }

  an_approved_delivery_with_a_courier:
    description: A delivery with an empty checklist, a courier assigned, and signed off as it stands.
    given: a_reserved_item
    steps:
      - request: { type: Delivery, transition: open, as: delivery, inputs: { unit: robot, price: SGD 11500.00, checklist: [] } }
      - request: { type: Courier, transition: register, as: courier, inputs: { name: Swift Couriers } }
      - request: { object: delivery, transition: assign_courier, inputs: { courier: courier } }
      - request: { object: delivery, transition: approve }

examples:
  opening_creates_the_checklist:
    description: Opening a delivery creates one checklist item for each label given, and mints the delivery's number.
    given: a_reserved_item
    request:
      type: Delivery
      transition: open
      as: delivery
      inputs: { unit: robot, price: SGD 11500.00, checklist: [Battery charged, Manual included] }
    expect:
      verdict: applied
      state: PREPARING
      values: { number: DLV-000001 }
      cascaded: [ChecklistItem.add, ChecklistItem.add]

  an_item_not_reserved_is_not_delivered:
    description: Once the reservation is released, a delivery of the item is refused until it is reserved again.
    given: a_reserved_item
    steps:
      - request: { object: robot, transition: release }
    request: { type: Delivery, transition: open, inputs: { unit: robot, price: SGD 11500.00, checklist: [] } }
    expect: { verdict: unsatisfied, clause: unit_reserved, remedy: dependent }

  cancelling_discards_the_open_checklist:
    description: Cancelling a delivery discards each checklist item still open, in the order they were added.
    given: a_delivery_being_prepared
    request: { object: delivery, transition: cancel }
    expect: { verdict: applied, state: CANCELLED, cascaded: [ChecklistItem.discard, ChecklistItem.discard] }

  an_approved_delivery_is_handed_over:
    description: Completing a signed-off delivery with a courier hands the item over, which delivers it externally at the delivery's price.
    given: an_approved_delivery_with_a_courier
    request: { object: delivery, transition: complete }
    expect: { verdict: applied, state: DELIVERED, cascaded: [InventoryItem.deliver_externally] }

  an_unapproved_delivery_is_not_handed_over:
    description: Without a sign-off the delivery is not completed, and the caller asks someone to approve it.
    given: a_reserved_item
    steps:
      - request: { type: Delivery, transition: open, as: delivery, inputs: { unit: robot, price: SGD 11500.00, checklist: [] } }
      - request: { type: Courier, transition: register, as: courier, inputs: { name: Swift Couriers } }
      - request: { object: delivery, transition: assign_courier, inputs: { courier: courier } }
    request: { object: delivery, transition: complete }
    expect: { verdict: unsatisfied, clause: signed_off, remedy: delegable }

  a_ticked_and_signed_off_delivery_is_handed_over:
    description: With its checklist ticked, a courier assigned and a sign-off given last, the delivery completes.
    given: a_delivery_ready_to_sign_off
    steps:
      - request: { object: delivery, transition: approve }
    request: { object: delivery, transition: complete }
    expect: { verdict: applied, state: DELIVERED, cascaded: [InventoryItem.deliver_externally] }

  an_open_checklist_item_holds_the_delivery:
    description: A delivery whose manual is not yet checked is not completed until someone checks it.
    given: a_delivery_being_prepared
    steps:
      - request: { object: battery, transition: check }
      - request: { type: Courier, transition: register, as: courier, inputs: { name: Swift Couriers } }
      - request: { object: delivery, transition: assign_courier, inputs: { courier: courier } }
      - request: { object: delivery, transition: approve }
    request: { object: delivery, transition: complete }
    expect: { verdict: unsatisfied, clause: checklist_complete, remedy: dependent }

  ticking_after_the_sign_off_makes_it_stale:
    description: A sign-off is of the delivery as it stands, so ticking the checklist after it leaves the sign-off stale, and someone signs off again.
    given: a_delivery_being_prepared
    steps:
      - request: { type: Courier, transition: register, as: courier, inputs: { name: Swift Couriers } }
      - request: { object: delivery, transition: assign_courier, inputs: { courier: courier } }
      - request: { object: delivery, transition: approve }
      - request: { object: battery, transition: check }
      - request: { object: manual, transition: check }
    request: { object: delivery, transition: complete }
    expect: { verdict: unsatisfied, clause: signed_off, remedy: delegable }

  a_sign_off_after_the_ticks_is_current:
    description: Signed off again once the checklist is ticked, the delivery completes.
    given: a_delivery_being_prepared
    steps:
      - request: { type: Courier, transition: register, as: courier, inputs: { name: Swift Couriers } }
      - request: { object: delivery, transition: assign_courier, inputs: { courier: courier } }
      - request: { object: delivery, transition: approve }
      - request: { object: battery, transition: check }
      - request: { object: manual, transition: check }
      - request: { object: delivery, transition: approve }
    request: { object: delivery, transition: complete }
    expect: { verdict: applied, state: DELIVERED, cascaded: [InventoryItem.deliver_externally] }
