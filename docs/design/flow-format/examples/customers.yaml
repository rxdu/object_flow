# yaml-language-server: $schema=../flow.schema.json
# Customers: personal data that can be corrected and erased, a state that can be
# overridden, and a customer that cannot be closed while an order is open.
module: customers
categories: [live, closed]

enumerations:
  OverrideReason: [MIS_KEYED, LEGACY_DATA, CUSTOMER_REQUEST]

sequences:
  customer_number:
    description: Numbers customers, in one series.

evaluators:
  xero:
    description: Xero, which owns the business's contacts and invoices.
    functions:
      contact_exists:
        description: Whether Xero holds a contact with this id.
        arguments:
          id: { type: string }
      invoice_valid:
        description: Whether an invoice with this number exists in Xero and is valid.
        arguments:
          invoice_number: { type: string }
        fresh: 30 min

types:
  Customer:
    description: A customer of the business, whose name and contact details are personal data.
    tracking: record

    attributes:
      number:
        type: string
        identifier: { sequence: customer_number, format: "C-{n:5}" }
        unique: true
      name:  { type: string, optional: true, personal: true }
      email: { type: string, optional: true, personal: true }
      xero_contact_id:
        type: string
        optional: true
        external: xero
        description: The customer's contact in Xero, which owns it.
      contacts:
        reference: "Contact[]"
        aggregation: composite
        opposite: customer
        description: The people to reach at the customer.
        cascade:
          - { on: [close], transition: discard, limit: 50 }
        survives: [merged_into]
      orders:
        reference: "Order[]"
        opposite: customer

    states:
      PROSPECT: { category: live }
      ACTIVE:
        category: live
        required_attributes: [email]
      DORMANT:
        description: Has not ordered for a year; kept on record, and may still be closed.
        category: closed
      CLOSED: { category: closed, final: true }
      MERGED:
        description: A duplicate, superseded by the customer it was merged into.
        category: closed
        final: true
        superseding: true

    conditions:
      contact_in_xero:
        description: The Xero contact being linked exists in Xero.
        expression: xero.contact_exists(inputs.xero_contact_id)
        evaluation: deferred
        remedy: dependent
      no_open_orders:
        description: No object that refers to the customer, an order, is still open.
        expression: none(r in referrers where r.state.category != closed)
        remedy: dependent

    transitions:
      register:
        kind: initial
        to: PROSPECT
        required_inputs: [name]
        optional_inputs: [email]
      activate:
        kind: external
        from: PROSPECT
        to: ACTIVE
        required_inputs: [email]
      lapse:
        kind: external
        from: ACTIVE
        to: DORMANT
      close:
        kind: external
        from: any
        to: CLOSED
        description: Closes the customer's record from whatever state it is in, once no order of theirs is open.
        guards:
          no_open_orders: deny
      merge_in:
        kind: internal
        from: [PROSPECT, ACTIVE, DORMANT]
        description: Merges a duplicate customer into this one, which supersedes it.
        inputs:
          duplicate: { reference: Customer }
        effect:
          - call: { target: inputs.duplicate, transition: merged_into, inputs: { successor: this } }
      merged_into:
        kind: external
        from: [PROSPECT, ACTIVE, DORMANT]
        to: MERGED
        description: Ends a duplicate, superseded by the customer it is merged into; its history stays readable through the successor.
        only_via: [Customer.merge_in]
        inputs:
          successor: { reference: Customer }
        effect:
          - supersede: inputs.successor
      add_contact:
        kind: internal
        from: [PROSPECT, ACTIVE]
        description: Adds a person to reach at the customer.
        inputs:
          role:  { type: string }
          phone: { type: string, optional: true, personal: true }
        effect:
          - create: { type: Contact, transition: add, inputs: { customer: this, role: inputs.role, phone: inputs.phone } }
      link_xero:
        kind: internal
        from: [PROSPECT, ACTIVE, DORMANT]
        description: Records the customer's Xero contact, as the sync with Xero requests.
        required_inputs: [xero_contact_id]
        guards:
          contact_in_xero: deny
      correct_email:
        kind: internal
        from: [PROSPECT, ACTIVE, DORMANT]
        description: Replaces an email address that was recorded wrongly.
        corrects: [email]
        required_inputs: [email]
        inputs:
          reason: { type: string }
      correct_state:
        kind: assertion
        to: [PROSPECT, ACTIVE, DORMANT]
        description: Puts the customer into the state they are really in, when the record is wrong.
        inputs:
          reason: { type: OverrideReason }
          detail: { type: string, optional: true, personal: true }
        may_admit: [active_invariant]
      forget:
        kind: erasure
        description: Erases the customer's personal data, and their contacts'.
        inputs:
          reason: { type: string }
        effect:
          - foreach:
              item: c
              array: contacts
              limit: 50
              steps:
                - call: { target: c, transition: forget, inputs: { reason: inputs.reason } }

    metrics:
      overrides:
        description: How many times a customer's state was overridden, by reason.
        source: transitions
        item: t
        filter: t.overrides
        dimensions:
          reason: t.reason
        time_dimension: t.occurred_at
        expression: count()

  Contact:
    description: A person to reach at a customer.
    tracking: record

    attributes:
      customer: { reference: Customer, opposite: contacts }
      role:     { type: string }
      phone:    { type: string, optional: true, personal: true }

    states:
      LISTED:  { category: live }
      REMOVED: { category: closed, final: true }

    transitions:
      add:
        kind: initial
        to: LISTED
        only_via: [Customer.add_contact]
        required_inputs: [customer, role]
        optional_inputs: [phone]
      discard:
        kind: external
        from: LISTED
        to: REMOVED
        only_via: [Customer.close]
      forget:
        kind: erasure
        description: Erases the contact's phone number, as its customer is erased.
        only_via: [Customer.forget]
        inputs:
          reason: { type: string }

  Order:
    description: An order a customer places.
    tracking: record

    attributes:
      customer:       { reference: Customer, opposite: orders }
      total:          { type: money(SGD) }
      invoice_number: { type: string, optional: true }

    states:
      OPEN:      { category: live }
      FULFILLED: { category: closed, final: true }
      CANCELLED: { category: closed, final: true }

    conditions:
      invoiced:
        description: The order has an invoice number.
        expression: invoice_number is not null
        remedy: unreachable_from_here
      invoice_valid_in_xero:
        description: The order's invoice is valid in Xero, as Xero said within the last half hour.
        expression: xero.invoice_valid(invoice_number)
        remedy: dependent

    transitions:
      place:
        kind: initial
        to: OPEN
        required_inputs: [customer, total]
      invoice:
        kind: internal
        from: OPEN
        required_inputs: [invoice_number]
      fulfil:
        kind: external
        from: OPEN
        to: FULFILLED
        guards:
          invoiced: deny
          invoice_valid_in_xero: deny
      cancel:
        kind: external
        from: OPEN
        to: CANCELLED
