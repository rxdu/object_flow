# yaml-language-server: $schema=../flow.schema.json
# Service flow: what a service job is, how it progresses, and what it records.
module: service
imports: { people: [User] }
categories: [inbound, live, closed]

enumerations:
  CheckOutcome: [PASS, FAIL, NOT_APPLICABLE]
  ReassignmentReason: [ABSENCE, WORKLOAD, SKILLS]

types:
  InspectionCheck:
    description: One entry of the inspection checklist. Entries are data, so changing the checklist requires no new version of the flow.
    tracking: record

    attributes:
      title: { type: string }

    states:
      ACTIVE:  { category: live }
      RETIRED: { category: closed, final: true }

    transitions:
      add:
        kind: initial
        to: ACTIVE
        required_inputs: [title]
      retire:
        kind: external
        from: ACTIVE
        to: RETIRED

  ServiceJob:
    description: A job an engineer performs on a robot.
    tracking: record

    attributes:
      engineer: { reference: User, assignee: true }
      photo:    { type: file, optional: true }
      signed_off_by_user: { reference: User, optional: true }

    observations:
      inspections:
        kind: InspectionResult
        description: One inspection result for the job.
        attributes:
          check:   { reference: InspectionCheck }
          outcome: { type: CheckOutcome }
          value:   { type: "decimal(10,3)", optional: true, unit: V }
          note:    { type: string, optional: true }
        max_recording_delay: 7 days
        invariants:
          value_in_range:
            description: A voltage reading, where present, is between 0 and 60 V.
            expression: value is null or (value >= 0.0 and value <= 60.0)

    states:
      OPEN:    { category: inbound }
      WORKING: { category: live }
      DONE:
        category: closed
        final: true
        required_attributes: [signed_off_by_user]

    derived_attributes:
      signed_off:
        description: The job has been signed off; queries may filter on it.
        expression: signed_off_by_user is not null
        indexed: true
      handoffs:
        description: How many times the job has passed from one engineer to another.
        expression: count(i in this.intervals(engineer) where i.value is not null) - 1

    conditions:
      engineer_active:
        description: The engineer being assigned is active.
        expression: inputs.engineer.state == User.ACTIVE
        remedy: self_serviceable
      no_unresolved_failure:
        description: Every failed inspection has a later inspection of the same checklist entry.
        expression: >-
          none(r in inspections where r.outcome == CheckOutcome.FAIL
               and none(s in inspections where s.check == r.check
                                           and s.recorded_at > r.recorded_at))
        remedy: dependent
      photo_attached:
        description: A photo is attached.
        expression: inputs.photo is not null
        remedy: self_serviceable

    transitions:
      open:
        kind: initial
        to: OPEN
        required_inputs: [engineer]
        guards:
          engineer_active: deny
      reassign:
        kind: internal
        from: [OPEN, WORKING]
        description: Gives the job to another engineer, saying why.
        required_inputs: [engineer]
        inputs:
          reason: { type: ReassignmentReason }
          note:   { type: string, optional: true, personal: true }
        guards:
          engineer_active: deny
      start:
        kind: external
        from: OPEN
        to: WORKING
        backdating_limit: 2 days
      finish:
        kind: external
        from: WORKING
        to: DONE
        description: Completes the job, signed off by the person responsible.
        optional_inputs: [photo]
        inputs:
          signed_off_by: { reference: User }
        guards:
          no_unresolved_failure: deny
          photo_attached: audit
        effect:
          - assign: { location: signed_off_by_user, expr: inputs.signed_off_by }
      forget:
        kind: erasure
        description: Erases the notes given when the job was reassigned, which are personal.
        inputs:
          reason: { type: string }

    metrics:
      time_working:
        description: Median time jobs spend in WORKING.
        measure: median_time_in_state
        state: WORKING
        group_by: [engineer, month]
        flag_when: { slow: "value > 10 days" }
      inspection_pass_rate:
        description: The share of applicable inspections that pass, per engineer.
        source: inspections
        item: r
        filter: r.outcome != CheckOutcome.NOT_APPLICABLE
        dimensions:
          engineer: r.subject.engineer
        time_dimension: r.occurred_at
        expression: count(where r.outcome == CheckOutcome.PASS) * 1.000 / count()
        flag_when: { low: "value < 0.900" }
      handoffs_per_job:
        description: The average number of times a job changes hands, by the month it was opened.
        source: objects
        item: o
        dimensions:
          month: month(o.created_at)
        time_dimension: o.created_at
        expression: avg(o.handoffs)
