# The service flow: what a job is, how it moves, and what it records.
module: service
uses: { people: [User] }

enums:
  CheckOutcome: [PASS, FAIL, NOT_APPLICABLE]

InspectionCheck:
  says: One item on the inspection checklist. The checklist is data, so changing it needs no publish.
  states:
    ACTIVE:  { category: live }
    RETIRED: { category: closed, final: true }
  moves:
    add:
      move:  -> ACTIVE
      takes: [title]
    retire:
      move:  ACTIVE -> RETIRED
  fields:
    title: string

ServiceJob:
  says: A job an engineer does on a robot.

  states:
    OPEN:    { category: inbound }
    WORKING: { category: live }
    DONE:    { category: closed, final: true }

  moves:
    open:
      move:   -> OPEN
      takes:  [engineer]
      checks: [engineer_active]
    reassign:
      move:   stays in OPEN, WORKING
      takes:  [engineer]
      checks: [engineer_active]
    start:
      move:   OPEN -> WORKING
      backdatable: 2 days
    finish:
      move:   WORKING -> DONE
      may take: [photo]
      checks: [no_unresolved_failure, photo_attached]
      flags:  [some_passed]

  rules:
    engineer_active:
      says:   The engineer supplied is still active.
      when:   inputs.engineer.state == User.ACTIVE
    no_unresolved_failure:
      says:   No inspection has failed without a later re-check of the same item.
      when: >-
        none(r in inspections where r.outcome == CheckOutcome.FAIL
             and none(s in inspections where s.check == r.check
                                         and s.recorded_at > r.recorded_at))
      remedy: dependent
    photo_attached:
      says:   A photo is attached.
      when:   inputs.photo is given
    some_passed:
      says:   At least one inspection passed.
      when:   any(r in inspections where r.outcome == CheckOutcome.PASS)
      remedy: dependent

  fields:
    engineer: { ref: User, assignee: true }
    photo:    file?

  records:
    inspections:
      kind: InspectionResult
      says: One inspection result for the job.
      fields:
        check:   InspectionCheck
        outcome: CheckOutcome
        value:
          type: decimal(10,3)?
          unit: V
        note:    string?
      late_by_up_to: 7 days
      invariants:
        in_range:
          says: A reading, where there is one, is between 0 and 60 V.
          when: value is null or (value >= 0.0 and value <= 60.0)

  measures:
    time_working: { median time in: WORKING, by: [engineer, month], flag slow: over 10 days }
