# Service flow: what a service job is, how it progresses, and what it records.
module: service
imports: { people: [User] }
categories: [inbound, live, closed]

enumerations:
  CheckOutcome: [PASS, FAIL, NOT_APPLICABLE]

types:
  InspectionCheck:
    description: One entry of the inspection checklist. Entries are data, so changing the checklist requires no new version of the flow.
    tracking: record

    attributes:
      title: { type: string }

    states:
      ACTIVE:  { category: live }
      RETIRED: { category: closed, terminal: true }

    transitions:
      add:
        kind: creation
        to: ACTIVE
        required_inputs: [title]
      retire:
        kind: state_change
        from: ACTIVE
        to: RETIRED

  ServiceJob:
    description: A job an engineer performs on a robot.
    tracking: record

    attributes:
      engineer: { reference: User, assignee: true }
      photo:    { type: file, optional: true }

    observations:
      inspections:
        kind: InspectionResult
        description: One inspection result for the job.
        attributes:
          check:   { reference: InspectionCheck }
          outcome: { type: CheckOutcome }
          value:   { type: "decimal(10,3)", optional: true, unit: V }
          note:    { type: string, optional: true }
        max_recording_delay: 7 days
        invariants:
          value_in_range:
            description: A voltage reading, where present, is between 0 and 60 V.
            expression: value is null or (value >= 0.0 and value <= 60.0)

    states:
      OPEN:    { category: inbound }
      WORKING: { category: live }
      DONE:    { category: closed, terminal: true }

    conditions:
      engineer_active:
        description: The engineer being assigned is active.
        expression: inputs.engineer.state == User.ACTIVE
        remedy: self_serviceable
      no_unresolved_failure:
        description: Every failed inspection has a later inspection of the same checklist entry.
        expression: >-
          none(r in inspections where r.outcome == CheckOutcome.FAIL
               and none(s in inspections where s.check == r.check
                                           and s.recorded_at > r.recorded_at))
        remedy: dependent
      photo_attached:
        description: A photo is attached.
        expression: inputs.photo is not null
        remedy: self_serviceable
      at_least_one_passed:
        description: At least one inspection passed.
        expression: any(r in inspections where r.outcome == CheckOutcome.PASS)
        remedy: dependent

    transitions:
      open:
        kind: creation
        to: OPEN
        required_inputs: [engineer]
        guards:
          engineer_active: enforced
      reassign:
        kind: action
        from: [OPEN, WORKING]
        required_inputs: [engineer]
        guards:
          engineer_active: enforced
      start:
        kind: state_change
        from: OPEN
        to: WORKING
        backdating_limit: 2 days
      finish:
        kind: state_change
        from: WORKING
        to: DONE
        optional_inputs: [photo]
        guards:
          no_unresolved_failure: enforced
          photo_attached: enforced
          at_least_one_passed: flagged

    metrics:
      time_working:
        description: Median time jobs spend in WORKING.
        measure: median_time_in_state
        state: WORKING
        group_by: [engineer, month]
        flag_when: { slow: "value > 10 days" }
