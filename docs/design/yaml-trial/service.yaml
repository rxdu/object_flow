# The service flow: what a job is, how it moves, and what it records.
module: service
uses: { people: [User] }
categories: [inbound, live, closed]

enums:
  CheckOutcome: [PASS, FAIL, NOT_APPLICABLE]

types:
  InspectionCheck:
    says: One item on the inspection checklist. The checklist is data, so changing it needs no publish.
    states:
      ACTIVE:  live
      RETIRED: closed, terminal
    fields:
      title: string
    transitions:
      add:    { to: ACTIVE, accepts: [title] }
      retire: { from: ACTIVE, to: RETIRED }

  ServiceJob:
    says: A job an engineer does on a robot.
    states:
      OPEN:    inbound
      WORKING: live
      DONE:    closed, terminal
    fields:
      engineer: { ref: User, assignee: true }
      photo:    file?

    transitions:
      open:     { to: OPEN,                 accepts: [engineer], requires: [engineer_active] }
      reassign: { at: [OPEN, WORKING],      accepts: [engineer], requires: [engineer_active] }
      start:    { from: OPEN, to: WORKING,  backdatable: 2 days }
      finish:   { from: WORKING, to: DONE,  accepts: [photo],
                  requires: [no_unresolved_failure], on_trial: [photo_attached] }

    rules:
      engineer_active:
        says: The engineer supplied is still active.
        when: inputs.engineer.state == User.ACTIVE
        remedy: self_serviceable
      no_unresolved_failure:
        says: No inspection has failed without a later re-check of the same item.
        when: >-
          none(r in inspections where r.outcome == CheckOutcome.FAIL
               and none(s in inspections where s.check == r.check
                                           and s.recorded_at > r.recorded_at))
        remedy: dependent
      photo_attached:
        says: A photo is attached.
        when: inputs.photo is not null
        remedy: self_serviceable

    records:
      inspections:
        kind: InspectionResult
        says: One inspection result for the job.
        fields:
          check:   InspectionCheck
          outcome: CheckOutcome
          value:
            type: decimal(10,3)?
            unit: V
          note:    string?
        late_by_up_to: 7 days
        invariants:
          in_range:
            says: A reading, where there is one, is between 0 and 60 V.
            when: value is null or (value >= 0.0 and value <= 60.0)

    measures:
      time_working:
        says: Median time jobs spend in WORKING, per engineer and month.
        from:   i in ServiceJob.intervals where i.state == ServiceJob.WORKING
        by:     { engineer: i.held(engineer), month: month(i.entered_at) }
        window: i.entered_at
        value:  median(i.duration)
        flags:  { slow: value > 10 days }
