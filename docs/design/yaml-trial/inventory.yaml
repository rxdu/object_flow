# Inventory flow: the lifecycle of one robot held in stock.
module: inventory
categories: [live, closed]

enumerations:
  Condition:      [NEW, REFURBISHED, DAMAGED]
  DevelopmentUse: [DEMO, TESTING, ENGINEERING]

types:
  InventoryItem:
    description: A robot held in stock, from the day it is added until it is retired.
    tracking: record

    attributes:
      serial:            { type: string, unique: true }
      model:             { type: string }
      list_price:        { type: money(SGD) }
      condition:         { type: Condition }
      recipient:
        type: string
        optional: true
        description: The customer or internal project the item is reserved for or delivered to.
      reserved_until:    { type: timestamp, optional: true }
      sale_price:        { type: money(SGD), optional: true }
      photo:             { type: file, optional: true }
      development_use:   { type: DevelopmentUse, optional: true }
      retirement_reason: { type: string, optional: true }

    states:
      AVAILABLE:
        description: In stock and free to be reserved.
        category: live
      RESERVED:
        description: Held for one recipient, a customer or an internal project, until a set time.
        category: live
        required_attributes: [recipient, reserved_until]
      SOLD:
        description: Delivered externally, to the customer it was reserved for; no longer available.
        category: closed
        required_attributes: [recipient, sale_price]
      DEVELOPMENT:
        description: Delivered internally, to the project it was reserved for, for demonstration, testing or engineering; no longer available.
        category: closed
        required_attributes: [recipient, development_use]
      RETIRED:
        description: Permanently withdrawn from stock and from use.
        category: closed
        final: true
        required_attributes: [retirement_reason]

    conditions:
      not_damaged:
        description: The item is not damaged; a damaged item is regraded before it is reserved or delivered.
        expression: condition != Condition.DAMAGED
        remedy: unreachable_from_here
      reservation_ends_in_future:
        description: The reservation ends at a time in the future.
        expression: inputs.reserved_until > now
        remedy: self_serviceable
      photo_attached:
        description: A photo of the item is attached.
        expression: inputs.photo is not null
        remedy: self_serviceable

    transitions:
      add:
        kind: initial
        to: AVAILABLE
        description: Adds a received item to stock.
        required_inputs: [serial, model, list_price, condition]
      regrade:
        kind: internal
        from: [AVAILABLE, RESERVED]
        description: Records the item's current condition.
        required_inputs: [condition]
      reserve:
        kind: external
        from: AVAILABLE
        to: RESERVED
        description: Holds the item for one recipient until the given time.
        required_inputs: [recipient, reserved_until]
        guards:
          not_damaged: deny
          reservation_ends_in_future: deny
      release:
        kind: external
        from: RESERVED
        to: AVAILABLE
        description: Ends the reservation; the item is free again.
        effect:
          - clear: [recipient, reserved_until]
      deliver_externally:
        kind: external
        from: RESERVED
        to: SOLD
        description: Delivers the item externally, to the customer it is reserved for, which completes the sale.
        required_inputs: [sale_price]
        optional_inputs: [photo]
        guards:
          not_damaged: deny
          photo_attached: audit
        effect:
          - clear: [reserved_until]
      deliver_internally:
        kind: external
        from: RESERVED
        to: DEVELOPMENT
        description: Delivers the item internally, to the project it is reserved for.
        required_inputs: [development_use]
        effect:
          - clear: [reserved_until]
      cancel_delivery:
        kind: external
        from: [SOLD, DEVELOPMENT]
        to: RESERVED
        description: Cancels an external or internal delivery; the item is reserved again for the same recipient.
        required_inputs: [reserved_until]
        guards:
          reservation_ends_in_future: deny
        effect:
          - clear: [sale_price, development_use]
      accept_return:
        kind: external
        from: SOLD
        to: AVAILABLE
        description: Takes an externally delivered item back into stock once it is graded.
        required_inputs: [condition]
        effect:
          - clear: [recipient, sale_price]
      return_to_stock:
        kind: external
        from: DEVELOPMENT
        to: AVAILABLE
        description: Returns an internally delivered item to stock once it is graded.
        required_inputs: [condition]
        effect:
          - clear: [recipient, development_use]
      retire:
        kind: external
        from: DEVELOPMENT
        to: RETIRED
        description: Withdraws an internally delivered item permanently.
        required_inputs: [retirement_reason]
        effect:
          - clear: [recipient, development_use]

    metrics:
      time_available:
        description: Median time items stay free before they are reserved.
        measure: median_time_in_state
        state: AVAILABLE
        group_by: [model, month]
        flag_when: { slow: "value > 60 days" }
      external_deliveries:
        description: Number of external deliveries, each of which completes a sale.
        measure: transition_count
        transition: deliver_externally
        group_by: [actor, month]
      deliveries_cancelled:
        description: Number of deliveries cancelled, external and internal.
        measure: transition_count
        transition: cancel_delivery
        group_by: [month]
      returns_accepted:
        description: Number of externally delivered items returned to stock.
        measure: transition_count
        transition: accept_return
        group_by: [month]
