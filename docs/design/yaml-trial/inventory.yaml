# The inventory flow: one robot, from the day it is added to stock until it
# is retired. Read `moves` first: the first line of each is one arrow of the
# diagram.
module: inventory

InventoryItem:
  says: One robot in stock, from the day it is added until it is retired.

  states:
    AVAILABLE:   { category: live }
    RESERVED:    { category: live,   holds: [reserved_for, reserved_until] }
    SOLD:        { category: closed, holds: [sold_to, sale_price] }
    DEVELOPMENT: { category: closed, holds: [use] }
    RETIRED:     { category: closed, holds: [retire_reason], final: true }

  moves:
    add:
      move:   -> AVAILABLE
      takes:  [serial, model, list_price, condition]
    regrade:
      move:   stays in AVAILABLE, RESERVED
      takes:  [condition]
    reserve:
      move:   AVAILABLE, DEVELOPMENT -> RESERVED
      takes:  [reserved_for, reserved_until]
      checks: [not_damaged, ends_later]
      clears: [use]
    release:
      move:   RESERVED -> AVAILABLE
      clears: [reserved_for, reserved_until]
    sell:
      move:   RESERVED -> SOLD
      takes:  [sale_price]
      may take: [photo]
      checks: [not_damaged]
      trial:  [photo_attached]
      copies: { sold_to: reserved_for }
      clears: [reserved_for, reserved_until]
    reopen:
      move:   SOLD -> RESERVED
      takes:  [reserved_until]
      checks: [ends_later]
      copies: { reserved_for: sold_to }
      clears: [sold_to, sale_price]
    accept_return:
      move:   SOLD -> AVAILABLE
      takes:  [condition]
      clears: [sold_to, sale_price]
    to_development:
      move:   RESERVED -> DEVELOPMENT
      takes:  [use]
      clears: [reserved_for, reserved_until]
    return_to_stock:
      move:   DEVELOPMENT -> AVAILABLE
      takes:  [condition]
      clears: [use]
    retire:
      move:   DEVELOPMENT -> RETIRED
      takes:  [retire_reason]

  rules:
    not_damaged:
      says:   A damaged item is not reserved or sold; regrade it first.
      when:   condition != DAMAGED
      remedy: unreachable_from_here
    ends_later:
      says:   The reservation ends at a time still to come.
      when:   inputs.reserved_until > now
    photo_attached:
      says:   A photo of the item is attached.
      when:   inputs.photo is given

  fields:
    serial:         { type: string, unique: true }
    model:          string
    list_price:     money(SGD)
    condition:      { one of: [NEW, REFURBISHED, DAMAGED] }
    reserved_for:   string?
    reserved_until: timestamp?
    sold_to:        string?
    sale_price:     money(SGD)?
    photo:          file?
    use:            { one of: [DEMO, TESTING, ENGINEERING], optional: true }
    retire_reason:  string?

  measures:
    days_on_hand: { median time in: AVAILABLE, by: [model, month], flag slow: over 60 days }
    sales:        { count of: sell,          by: [who, month] }
    reopened:     { count of: reopen,        by: [month] }
    returned:     { count of: accept_return, by: [month] }
